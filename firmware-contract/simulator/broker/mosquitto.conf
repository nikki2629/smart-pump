listener 8883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/local/password_file
acl_file /mosquitto/config/acl

cafile /mosquitto/local/certs/ca.crt
certfile /mosquitto/local/certs/broker.crt
keyfile /mosquitto/local/certs/broker.key
tls_version tlsv1.2
require_certificate false

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
