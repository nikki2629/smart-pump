services:
  - type: web
    name: smart-pump-backend
    env: python
    buildCommand: pip3 install -r requirements.txt && cd backend && python3 manage.py collectstatic --noinput && python3 manage.py migrate
    startCommand: gunicorn --chdir backend config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
