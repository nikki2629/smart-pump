services:
  - type: web
    name: smart-pump-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py ensure_admin_user
    startCommand: gunicorn --chdir backend config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_ENGINE
        value: "sqlite"
      - key: DJANGO_SECRET_KEY
        generateValue: true
